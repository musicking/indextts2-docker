services:
  indextts25-api:
    container_name: indextts25-api
    image: dockermaker0/indextts2:audio-cpp-latest
    build:
      context: .
      dockerfile: docker/audio-cpp/Dockerfile
    ports:
      - "7863:7863"
    volumes:
      - ./voices:/voices:ro
    gpus: all
    shm_size: 8gb
    init: true
    stop_grace_period: 2m
    restart: unless-stopped
