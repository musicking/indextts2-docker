services:
  indextts25-api:
    container_name: indextts25-api
    image: dockermaker0/indextts25-api:latest
    build:
      context: .
      dockerfile: docker/audio-cpp/Dockerfile
    ports:
      - "7864:7864"
    volumes:
      - ./voices:/voices:ro
    gpus: all
    shm_size: 8gb
    init: true
    stop_grace_period: 2m
    restart: unless-stopped
