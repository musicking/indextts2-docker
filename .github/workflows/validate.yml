name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
      - name: Install WebUI dependencies
        run: uv sync --frozen --extra webui
      - name: Compile WebUI and Docker helpers
        run: uv run python -m py_compile webui.py docker/download_models.py
      - name: Validate audio.cpp API assets
        run: |
          python -m json.tool docker/audio-cpp/server.json >/dev/null
          bash -n docker/audio-cpp/entrypoint.sh
