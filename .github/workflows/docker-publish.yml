name: Build and publish Docker images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag (for example, v3.0.0)
        required: true
        type: string
      flavor:
        description: Image flavor to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - base
          - vietnamese
          - japanese

permissions:
  contents: read

env:
  IMAGE: musicking/indextts2

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this exact source revision
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image
        if: inputs.flavor == 'all' || inputs.flavor == 'base'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Build and push Vietnamese image
        if: inputs.flavor == 'all' || inputs.flavor == 'vietnamese'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.vietnamese
          platforms: linux/amd64
          push: true
          build-args: BASE_IMAGE=${{ env.IMAGE }}:${{ inputs.flavor == 'all' && format('sha-{0}', github.sha) || 'latest' }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}-vietnamese
            ${{ env.IMAGE }}:latest-vietnamese
          cache-from: type=gha,scope=vietnamese
          cache-to: type=gha,mode=max,scope=vietnamese

      - name: Build and push Japanese image
        if: inputs.flavor == 'all' || inputs.flavor == 'japanese'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.japanese
          platforms: linux/amd64
          push: true
          build-args: BASE_IMAGE=${{ env.IMAGE }}:${{ inputs.flavor == 'all' && format('sha-{0}', github.sha) || 'latest' }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}-japanese
            ${{ env.IMAGE }}:latest-japanese
          cache-from: type=gha,scope=japanese
          cache-to: type=gha,mode=max,scope=japanese
