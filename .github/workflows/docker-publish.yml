name: Build and publish Docker images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Docker image version (for example, 2.5.0)
        required: true
        default: 2.5.0
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: docker
    env:
      IMAGE: dockermaker0/indextts2
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Validate Docker Hub configuration
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "${DOCKER_USERNAME}" || { echo "DOCKER_USERNAME secret is not configured"; exit 1; }
          test -n "${DOCKER_PASSWORD}" || { echo "DOCKER_PASSWORD secret is not configured"; exit 1; }
          test -n "${VERSION}" || { echo "Release tag is not available"; exit 1; }

      - name: Free disk space
        run: sudo rm -rf /opt/hostedtoolcache

      - name: Checkout this exact source revision
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push IndexTTS 2.5 WebUI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:2.5
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=indextts25
          cache-to: type=gha,mode=max,scope=indextts25
