name: Build and publish audio.cpp API image

on:
  push:
    branches: [codex/audio-cpp-api]
    paths:
      - .github/workflows/audio-cpp-publish.yml
      - docker/audio-cpp/**
      - docker-compose.audio-cpp.yml
      - docs/AUDIOCPP_API_ZH.md
  workflow_dispatch:
    inputs:
      version:
        description: Image version (for example, 2.5.2)
        required: true
        default: 2.5.2
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: docker
    env:
      IMAGE: dockermaker0/indextts25-api
      VERSION: ${{ inputs.version || '2.5.2' }}
    steps:
      - name: Validate Docker Hub configuration
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "${DOCKER_USERNAME}" || { echo "DOCKER_USERNAME secret is not configured"; exit 1; }
          test -n "${DOCKER_PASSWORD}" || { echo "DOCKER_PASSWORD secret is not configured"; exit 1; }
          test -n "${VERSION}" || { echo "Image version is not available"; exit 1; }

      - name: Free disk space
        run: sudo rm -rf /opt/hostedtoolcache

      - name: Checkout this exact source revision
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push IndexTTS 2.5 audio.cpp API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/audio-cpp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:2.5
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
