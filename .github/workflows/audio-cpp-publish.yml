name: Build and publish audio.cpp API image

on:
  push:
    branches: [codex/audio-cpp-api]
    paths:
      - .github/workflows/audio-cpp-publish.yml
      - docker/audio-cpp/**
      - docker-compose.audio-cpp.yml
      - docs/AUDIOCPP_API_ZH.md
  workflow_dispatch:
    inputs:
      version:
        description: Image version (for example, 2.5.4)
        required: true
        default: 2.5.4
        type: string
      config_only:
        description: Reuse the pinned runtime and weights; update server configuration only
        required: false
        default: false
        type: boolean
      base_image:
        description: Optional verified base image digest for config-only builds
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: docker
    env:
      IMAGE: dockermaker0/indextts25-api
      VERSION: ${{ inputs.version || '2.5.4' }}
    steps:
      - name: Validate Docker Hub configuration
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "${DOCKER_USERNAME}" || { echo "DOCKER_USERNAME secret is not configured"; exit 1; }
          test -n "${DOCKER_PASSWORD}" || { echo "DOCKER_PASSWORD secret is not configured"; exit 1; }
          test -n "${VERSION}" || { echo "Image version is not available"; exit 1; }

      - name: Free disk space
        run: sudo rm -rf /opt/hostedtoolcache

      - name: Checkout this exact source revision
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build source and bundled models for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ (inputs.config_only || contains(github.event.head_commit.message, '[api-config-only]')) && 'docker/audio-cpp/Dockerfile.config' || 'docker/audio-cpp/Dockerfile' }}
          build-args: ${{ inputs.base_image && format('API_BASE_IMAGE={0}', inputs.base_image) || '' }}
          platforms: linux/amd64
          load: true
          tags: indextts-api-validation:local

      - name: Validate API startup and registered models (no GPU inference)
        run: |
          set -euo pipefail
          python3 -m json.tool docker/audio-cpp/server.json >/dev/null
          bash -n docker/audio-cpp/entrypoint.sh
          runtime_revision=$(awk -F= '/^ARG AUDIOCPP_REVISION=/ {print $2; exit}' docker/audio-cpp/Dockerfile)
          model_revision=$(awk -F= '/^ARG MODEL_REVISION=/ {print $2; exit}' docker/audio-cpp/Dockerfile)
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' indextts-api-validation:local)" = "$runtime_revision"
          test "$(docker image inspect --format '{{ index .Config.Labels "ai.indextts.model.revision" }}' indextts-api-validation:local)" = "$model_revision"
          docker run -d --name api-smoke -p 127.0.0.1:7864:7864 indextts-api-validation:local
          trap 'docker logs api-smoke; docker rm -f api-smoke; docker image rm indextts-api-validation:local' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:7864/health
          curl --fail http://127.0.0.1:7864/v1/models > /tmp/api-models.json
          python3 - <<'PY'
          import json
          with open('/tmp/api-models.json') as f:
              models = json.load(f)['data']
          assert {m['id'] for m in models} == {
              'indextts-2.5', 'voxcpm2', 'qwen3-asr-1.7b', 'qwen3-forced-aligner-0.6b'
          }, models
          assert all(not m['loaded'] for m in models), models
          PY

      - name: Publish validated multi-model API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ (inputs.config_only || contains(github.event.head_commit.message, '[api-config-only]')) && 'docker/audio-cpp/Dockerfile.config' || 'docker/audio-cpp/Dockerfile' }}
          build-args: ${{ inputs.base_image && format('API_BASE_IMAGE={0}', inputs.base_image) || '' }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:2.5
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
