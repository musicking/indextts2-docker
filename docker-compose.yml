services:
  indextts25:
    container_name: indextts25
    image: dockermaker0/indextts2:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "7863:7863"
    environment:
      WEBUI_PORT: "7863"
      USE_BF16: "1"
      USE_CUDA_KERNEL: "0"
    volumes:
      - indextts25-outputs:/app/outputs
    shm_size: 8gb
    gpus: all
    restart: unless-stopped

volumes:
  indextts25-outputs:
